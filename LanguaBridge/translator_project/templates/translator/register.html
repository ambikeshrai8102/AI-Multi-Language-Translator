{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — LinguaBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
        .auth-box{background:var(--bg-1);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:440px;box-shadow:var(--shadow),var(--glow);animation:fadeUp .5s ease both}
        .auth-logo{text-align:center;margin-bottom:2rem}
        .auth-logo-icon{font-size:2.5rem;display:block;margin-bottom:.4rem}
        .auth-logo-name{font-family:var(--font-d);font-size:1.5rem;font-weight:800;color:var(--text)}
        .auth-title{font-family:var(--font-d);font-size:1.4rem;font-weight:700;margin-bottom:.3rem}
        .auth-sub{color:var(--text-2);font-size:.88rem;margin-bottom:1.75rem}
        .form-group{margin-bottom:1.1rem}
        .form-label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin-bottom:.4rem}
        .form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font-b);font-size:.95rem;padding:.7rem 1rem;transition:var(--t);box-sizing:border-box}
        .form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
        .form-hint{font-size:.75rem;color:var(--text-3);margin-top:.3rem}
        .auth-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:var(--font-d);font-size:1rem;font-weight:700;padding:.8rem;cursor:pointer;transition:var(--t);margin-top:.5rem}
        .auth-btn:hover{background:#2563eb;transform:translateY(-1px)}
        .auth-footer{text-align:center;margin-top:1.5rem;font-size:.88rem;color:var(--text-2)}
        .auth-footer a{color:var(--accent);text-decoration:none;font-weight:600}
        .auth-footer a:hover{text-decoration:underline}
        .msg-list{list-style:none;margin-bottom:1.2rem;padding:0}
        .msg-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;border-radius:8px;padding:.6rem .9rem;font-size:.85rem;margin-bottom:.4rem}
        .msg-success{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:#34d399;border-radius:8px;padding:.6rem .9rem;font-size:.85rem;margin-bottom:.4rem}
        .strength-bar{height:4px;border-radius:99px;background:var(--border);margin-top:.4rem;overflow:hidden}
        .strength-fill{height:100%;border-radius:99px;transition:all .3s;width:0}
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-box">

        <div class="auth-logo">
            <span class="auth-logo-icon">🌐</span>
            <span class="auth-logo-name">LinguaBridge</span>
        </div>

        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Join LinguaBridge and start translating</p>

        {% if messages %}
        <ul class="msg-list">
            {% for msg in messages %}
            <li class="{% if msg.tags == 'error' %}msg-error{% else %}msg-success{% endif %}">
                {{ msg }}
            </li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST" action="{% url 'translator:register' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input"
                    placeholder="Choose a username" required autofocus
                    value="{{ request.POST.username }}">
            </div>

            <div class="form-group">
                <label class="form-label">
                    Email <span style="color:var(--text-3);font-weight:400">(optional)</span>
                </label>
                <input type="email" name="email" class="form-input"
                    placeholder="your@email.com"
                    value="{{ request.POST.email }}">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password1" id="pw1"
                    class="form-input" placeholder="Minimum 6 characters" required>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <p class="form-hint" id="strengthText">Enter a password</p>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="password2" id="pw2"
                    class="form-input" placeholder="Repeat your password" required>
                <p class="form-hint" id="matchText"></p>
            </div>

            <button type="submit" class="auth-btn">🚀 Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="{% url 'translator:login' %}">Sign in →</a>
        </div>

    </div>
</div>

<script>
var pw1 = document.getElementById('pw1');
var pw2 = document.getElementById('pw2');
var fill = document.getElementById('strengthFill');
var strengthText = document.getElementById('strengthText');
var matchText = document.getElementById('matchText');

pw1.addEventListener('input', function() {
    var val = this.value;
    var score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    var colors = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6'];
    var labels = ['Too short','Weak','Fair','Strong','Very Strong'];
    var pcts   = [20, 40, 60, 80, 100];
    var idx    = Math.max(0, score - 1);

    fill.style.width      = val.length ? pcts[idx] + '%' : '0%';
    fill.style.background = val.length ? colors[idx] : '';
    strengthText.textContent = val.length ? labels[idx] : 'Enter a password';
});

pw2.addEventListener('input', function() {
    if (!this.value) { matchText.textContent = ''; return; }
    if (this.value === pw1.value) {
        matchText.textContent = '✓ Passwords match';
        matchText.style.color = '#34d399';
    } else {
        matchText.textContent = '✗ Passwords do not match';
        matchText.style.color = '#f87171';
    }
});
</script>
</body>
</html>
